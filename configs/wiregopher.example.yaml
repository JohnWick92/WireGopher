# When the config file is loaded, it will be expanded by Go.
# This means you can define any variable in this file as an ENV variable.
# Sensitive values, such as API keys and secrets, should always be set this way.
# For docker everything should go on ENV
server:
  http:
    port: "WIREGOPHER_PORT"
firewall:
  # This is how to set the firewall model
  firewallModel: "opnsense"
  opnsense:
    url: "https:<your OPNsense url for MGMT>"
    # This should be setted as ENV var
    apiKey: "YOUR_OPNSENSE_VAR_API_KEY"
    apiSecret: "YOUR_OPNSENSE_VAR_API_SECRET"
