services:
  app-dev:
    build:
      context: ..
      dockerfile: docker_dev/Dockerfile
    container_name: wiregopher-dev
    ports:
      - "${WIREGOPHER_PORT:-8080}:${WIREGOPHER_PORT:-8080}"
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - ../:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
      - ./configs/wiregopher.yaml:/etc/wiregopher/wiregopher.yaml:ro
    depends_on: 
      - alloy-dev
    stdin_open: true
    tty: true

# Alloy and Loki should not be running on the same machine
# of the WireGopher on production
  alloy-dev:
    image: grafana/alloy:latest
    restart: unless-stopped
    ports:
      - "12345:12345"
    container_name: alloy-dev
    depends_on:
      - loki-dev
    volumes:
      - ./configs/config-example.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy

  loki-dev:
    container_name: loki-dev
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    volumes:
      - ./configs/loki-example.yaml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml

  grafana-dev:
    image: grafana/grafana:latest
    container_name: grafana-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  go-mod-cache:
  go-build-cache:
  alloy-data:
  grafana-data:
