root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -buildvcs=false -o ./tmp/main ./cmd/wiregopher"
  bin = "./tmp/main"
  delay = 500
  exclude_dir = ["tmp", "vendor", ".git"]
  exclude_regex = ["_test.go"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  kill_delay = "1s"
  send_interrupt = true

[log]
  time = true

[misc]
  clean_on_exit = true
